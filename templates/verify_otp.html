{% extends 'base.html' %}{% block title %}Vérification OTP{% endblock %}{% block content %}<section class="auth-shell"><div class="auth-card"><div class="logo">🔐</div><h1>Vérification MFA</h1><p class="text-muted">Entrez le code TOTP à 6 chiffres.</p><div class="otp-timer"><span id="otpCountdown">30</span>s</div><form method="post" id="otpForm"><input id="otpInput" name="otp" class="form-control otp-input" maxlength="6" pattern="\d{6}" inputmode="numeric" required placeholder="000000"><button class="btn btn-hospital w-100 mt-3">Vérifier</button></form><button class="btn btn-link mt-2" type="button" data-resend>Resend code</button>{% if debug_code %}<div class="alert alert-info mt-3 small">Code de test courant : <strong>{{ debug_code }}</strong></div>{% endif %}</div></section>{% endblock %}
